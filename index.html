<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kurznotizen</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:#fff;color:#222;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 4px 12px;-webkit-app-region:drag;user-select:none}
.bar h1{font-size:16px;margin:0}
.bar .btns{display:flex;-webkit-app-region:no-drag}
.bar button{border:0;background:none;font-size:15px;cursor:pointer;padding:3px 8px;border-radius:5px;color:#333}
.bar button:hover{background:#eee}
.bar button.on{background:#dff0d8}
.bar button.x:hover{background:#e81123;color:#fff}
.tools{padding:0 12px 8px;display:flex;gap:6px}
#search{flex:1;padding:7px 10px;border:0;background:#eee;border-radius:4px;font-size:13px}
#add{border:0;background:#eee;border-radius:4px;width:34px;font-size:18px;cursor:pointer}
#add:hover{background:#ddd}
#list{flex:1;overflow-y:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.note{border-radius:4px;padding:6px 8px 8px}
.meta{display:flex;justify-content:space-between;font-size:11px;color:#555;align-items:center}
.meta button{border:0;background:none;cursor:pointer;font-size:13px;opacity:.55}
.meta button:hover{opacity:1}
.note textarea{width:100%;border:0;background:transparent;resize:none;font:inherit;font-size:14px;outline:none;min-height:56px;overflow:hidden;display:block}
.c0{background:#e3f6dd}.c1{background:#fff3b0}.c2{background:#ffd9e3}.c3{background:#d6ebff}.c4{background:#eadcff}
.empty{color:#888;text-align:center;margin-top:20px;font-size:13px}
.foot{font-size:10.5px;color:#999;text-align:center;padding:4px;border-top:1px solid #eee}
</style>
</head>
<body>
<div class="bar">
  <h1>Kurznotizen</h1>
  <div class="btns">
    <button id="auto" title="Mit Windows starten">⚡</button>
    <button id="pin" title="Immer im Vordergrund">📌</button>
    <button id="min" title="Minimieren">–</button>
    <button id="close" class="x" title="Schließen">✕</button>
  </div>
</div>
<div class="tools"><input id="search" placeholder="Suchen…"><button id="add" title="Neue Notiz (Strg+Alt+N)">＋</button></div>
<div id="list"></div>
<div class="foot">Strg+Alt+N neue Notiz · Strg+Alt+K ein-/ausblenden</div>
<script>
const KEY="kurznotizen_v1";
let notes=[];
try{notes=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
const save=()=>localStorage.setItem(KEY,JSON.stringify(notes));
const $=id=>document.getElementById(id);
const list=$("list");
function fmt(t){const d=new Date(t),n=new Date();const hm=d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});return d.toDateString()===n.toDateString()?hm:d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})+" "+hm}
function grow(t){t.style.height="auto";t.style.height=t.scrollHeight+"px"}
function render(){
  const q=$("search").value.toLowerCase();
  list.innerHTML="";
  const shown=notes.filter(n=>n.text.toLowerCase().includes(q)).sort((a,b)=>b.time-a.time);
  if(!shown.length){list.innerHTML='<div class="empty">'+(notes.length?"Nichts gefunden":"Noch keine Notizen – auf ＋ klicken")+'</div>';return}
  shown.forEach(n=>{
    const el=document.createElement("div");el.className="note c"+n.color;
    el.innerHTML='<div class="meta"><span class="t"></span><span><button class="col" title="Farbe">🎨</button><button class="del" title="Löschen">🗑</button></span></div><textarea placeholder="Notiz…"></textarea>';
    el.querySelector(".t").textContent=fmt(n.time);
    const ta=el.querySelector("textarea");ta.value=n.text;
    ta.addEventListener("input",()=>{n.text=ta.value;n.time=Date.now();save();grow(ta);el.querySelector(".t").textContent=fmt(n.time)});
    el.querySelector(".col").onclick=()=>{n.color=(n.color+1)%5;save();el.className="note c"+n.color};
    el.querySelector(".del").onclick=()=>{if(!n.text.trim()||confirm("Notiz löschen?")){notes=notes.filter(x=>x!==n);save();render()}};
    list.appendChild(el);grow(ta);
  });
}
function addNote(){
  $("search").value="";
  notes.push({id:Date.now(),text:"",time:Date.now(),color:notes.length%5});
  save();render();
  setTimeout(()=>{const ta=list.querySelector("textarea");ta&&ta.focus()},0);
}
$("search").addEventListener("input",render);
$("add").onclick=addNote;
kn.onNew(addNote);
$("min").onclick=()=>kn.minimize();
$("close").onclick=()=>kn.close();
$("pin").onclick=async()=>{$("pin").classList.toggle("on",await kn.togglePin())};
$("auto").onclick=async()=>{$("auto").classList.toggle("on",await kn.toggleAutostart())};
kn.state().then(s=>{$("pin").classList.toggle("on",s.pinned);$("auto").classList.toggle("on",s.autostart)});
render();
</script>
</body>
</html>
